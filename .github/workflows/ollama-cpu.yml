name: build Ollama CPU runtime
on:
  push:
    branches: [main]
    paths: [lab3/model/**, .github/workflows/ollama-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: lab3/model
          push: true
          tags: docker.io/kostyapin/ollama-cpu-333714:latest
