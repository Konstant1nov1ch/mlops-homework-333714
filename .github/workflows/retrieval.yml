name: retrieval release
on:
  push:
    branches: [main]
    paths: [lab2/**, .github/workflows/retrieval.yml]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the teaching namespace
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: retrieval-delivery
  cancel-in-progress: false
env:
  HELM_DRIVER: configmap
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r lab2/requirements.txt pytest httpx
      - name: Check quality and chart
        run: |
          set -euo pipefail
          cd lab2
          mkdir -p evidence/quality
          python scripts/build_index.py | tee evidence/quality/index.json
          python -m pytest -q | tee evidence/quality/tests.txt
          python scripts/evaluate.py > evidence/quality/normal.json
          if python scripts/evaluate.py --ranking-mode reverse > evidence/quality/reverse.json 2> evidence/quality/reverse-error.txt; then
            echo 'reverse must fail' >&2; exit 1
          fi
          python -c "import json; x=json.load(open('evidence/quality/reverse.json')); assert x['mrr'] < .85 or x['recall_at_3'] < .90"
          if helm template retrieval chart > /dev/null 2>&1; then echo 'empty digest must fail' >&2; exit 1; fi
          helm template retrieval chart --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > evidence/quality/chart.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-quality-${{ github.run_id }}
          path: lab2/evidence/quality/
          if-no-files-found: warn
  build:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: lab2
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: docker.io/kostyapin/retrieval-333714:${{ github.sha }}
      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p evidence
          printf '%s\n' "$IMAGE_DIGEST" > evidence/image-digest.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/build-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-image-${{ github.run_id }}
          path: evidence/
  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Deploy and test staging
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"; if [ -n "${pf:-}" ]; then kill "$pf" 2>/dev/null || true; fi' EXIT
          cd lab2
          mkdir -p evidence/staging
          helm upgrade --install pinchuk-search-staging chart -n itmo-student-06 --set-string image.digest="$DIGEST" --set-string buildRevision="$GITHUB_SHA" --wait --timeout 5m
          helm test pinchuk-search-staging -n itmo-student-06 --logs --timeout 3m 2>&1 | tee evidence/staging/helm-test.txt
          kubectl -n itmo-student-06 port-forward service/pinchuk-search-staging 18081:80 & pf=$!
          for i in $(seq 1 30); do curl -fsS http://localhost:18081/readyz && break; sleep 1; done
          python smoke.py http://localhost:18081 | tee evidence/staging/smoke.json
          curl -fsS http://localhost:18081/meta > evidence/staging/meta.json
          helm history pinchuk-search-staging -n itmo-student-06 -o json > evidence/staging/helm-history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-staging-${{ github.run_id }}
          path: lab2/evidence/staging/
          if-no-files-found: warn
  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Promote, test and verify rollback
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"; if [ -n "${pf:-}" ]; then kill "$pf" 2>/dev/null || true; fi; if [ -n "${stage_pf:-}" ]; then kill "$stage_pf" 2>/dev/null || true; fi' EXIT
          cd lab2
          mkdir -p evidence/production
          helm upgrade --install pinchuk-search-prod chart -n itmo-student-06 --set-string environment=production --set-string image.digest="$DIGEST" --set-string buildRevision="$GITHUB_SHA" --wait --timeout 5m
          helm test pinchuk-search-prod -n itmo-student-06 --logs --timeout 3m 2>&1 | tee evidence/production/helm-test.txt
          kubectl -n itmo-student-06 port-forward service/pinchuk-search-prod 18082:80 & pf=$!
          for i in $(seq 1 30); do curl -fsS http://localhost:18082/readyz && break; sleep 1; done
          python smoke.py http://localhost:18082 | tee evidence/production/smoke.json
          IMAGE_DIGEST="$DIGEST" bash demo_rollback.sh pinchuk-search-prod 2>&1 | tee evidence/production/rollback.txt
          kill "$pf" 2>/dev/null || true
          wait "$pf" 2>/dev/null || true
          kubectl -n itmo-student-06 port-forward service/pinchuk-search-prod 18082:80 & pf=$!
          for i in $(seq 1 30); do curl -fsS http://localhost:18082/readyz && break; sleep 1; done
          helm test pinchuk-search-prod -n itmo-student-06 --logs --timeout 3m 2>&1 | tee evidence/production/helm-test-after-rollback.txt
          for release in pinchuk-search-staging pinchuk-search-prod; do
            actual=$(kubectl -n itmo-student-06 get deployment "$release" -o jsonpath='{.spec.template.spec.containers[0].image}')
            test "$actual" = "docker.io/kostyapin/retrieval-333714@$DIGEST"
          done
          kubectl -n itmo-student-06 port-forward service/pinchuk-search-staging 18084:80 & stage_pf=$!
          for i in $(seq 1 30); do curl -fsS http://localhost:18084/readyz && break; sleep 1; done
          curl -fsS http://localhost:18082/meta > evidence/production/meta.json
          IMAGE_DIGEST="$DIGEST" BUILD_REVISION="$GITHUB_SHA" python compare_release.py http://localhost:18084 http://localhost:18082 | tee evidence/production/comparison.json
          helm history pinchuk-search-prod -n itmo-student-06 -o json > evidence/production/helm-history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-production-${{ github.run_id }}
          path: lab2/evidence/production/
          if-no-files-found: warn
