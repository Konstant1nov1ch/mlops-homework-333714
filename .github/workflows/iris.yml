name: iris build
on:
  push:
    branches: [main]
    paths: [lab1/**, .github/workflows/iris.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r lab1/requirements.txt pytest httpx
      - run: cd lab1 && python train.py && python -m pytest -q
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: lab1
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: docker.io/kostyapin/iris-333714:${{ github.sha }}
